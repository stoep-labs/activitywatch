services:
  aw:
    image: stoep.co.uk:5000/aw:latest
    container_name: aw
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["infra", "all"]
    networks:
      t3_proxy:
    volumes:
      - $DOCKERDIR/appdata/aw/data:/root/.local/share/activitywatch
      - $DOCKERDIR/appdata/aw/config:/root/.config/activitywatch/aw-server-rust
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      TZ: $TZ
      LOG_LEVEL: info
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.aw-svc.loadbalancer.server.port=5600"
      # API router — public, no OAuth (priority 120)
      - "traefik.http.routers.aw-api-rtr.entrypoints=websecure"
      - "traefik.http.routers.aw-api-rtr.rule=Host(`aw.$DOMAINNAME_HS`) && PathPrefix(`/api`)"
      - "traefik.http.routers.aw-api-rtr.priority=120"
      - "traefik.http.routers.aw-api-rtr.service=aw-svc"
      # Public leaderboard — no OAuth (priority 110)
      - "traefik.http.routers.aw-leaderboard-rtr.entrypoints=websecure"
      - "traefik.http.routers.aw-leaderboard-rtr.rule=Host(`aw.$DOMAINNAME_HS`) && PathPrefix(`/static/leaderboard`)"
      - "traefik.http.routers.aw-leaderboard-rtr.priority=110"
      - "traefik.http.routers.aw-leaderboard-rtr.service=aw-svc"
      # Main web UI — behind OAuth (priority 99)
      - "traefik.http.routers.aw-rtr.entrypoints=websecure"
      - "traefik.http.routers.aw-rtr.rule=Host(`aw.$DOMAINNAME_HS`)"
      - "traefik.http.routers.aw-rtr.priority=99"
      - "traefik.http.routers.aw-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.aw-rtr.service=aw-svc"
